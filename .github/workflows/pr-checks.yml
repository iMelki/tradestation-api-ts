name: Pull Request Checks

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build / lint / typecheck / test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Node 18 is end-of-life; 20 and 22 are the supported LTS lines.
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck examples
        run: npx tsc -p tsconfig.examples.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Gate on advisories in what consumers of the package install (runtime deps).
      # Dev-only tooling advisories are left to Dependabot rather than failing every PR.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level high

      - name: Verify package-lock.json is up to date
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code package-lock.json
